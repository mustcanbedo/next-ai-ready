name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  e2e-smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run e2e smoke test
        run: node scripts/e2e-smoke.mjs

      - name: Release checks
        run: pnpm exports:check && pnpm api:check && pnpm pack:check && pnpm bin:smoke

  external-install-matrix:
    name: External (${{ matrix.package-manager }}, Next ${{ matrix.next-version }})
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package-manager: [pnpm, npm]
        next-version: [14, 15, 16]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable dependency graph
        run: pnpm --filter next-ai-ready... build

      - name: Run clean external install and production build
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          NEXT_VERSION: ${{ matrix.next-version }}
          PACKAGE_SOURCE: tarball
        run: node scripts/external-quickstart-smoke.mjs

  docs-site-smoke:
    name: Docs Site Smoke
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace CLI
        run: pnpm --filter next-ai-ready... build

      - name: Build docs site
        run: pnpm --filter docs-site build

      - name: Run docs-site smoke
        run: pnpm --filter docs-site smoke

      - name: Verify SDK and documentation release versions are synchronized
        run: pnpm release:docs:check
